name: 単語・VTuber追加リクエスト
description: 辞書に未登録のVTuberや関連用語の追加を申請します
title: "[追加] "
labels: ["enhancement", "data-update"]
body:
  - type: markdown
    attributes:
      value: |
        辞書への追加リクエストありがとうございます！
        以下の項目を入力してください。
  - type: input
    id: word
    attributes:
      label: 単語・表記（例: 星街すいせい）
      placeholder: 正式な表記を入力してください
    validations:
      required: true
  - type: input
    id: reading
    attributes:
      label: 読み（ひらがな）（例: ほしまちすいせい）
      placeholder: 全角ひらがなで入力してください
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: カテゴリ
      options:
        - VTuber名
        - ユニット・グループ名
        - ファンネーム・用語
    validations:
      required: true
  - type: input
    id: group
    attributes:
      label: 所属・グループ（任意）（例: ホロライブ）
  - type: input
    id: source
    attributes:
      label: 公式情報URL / 参考リンク
      placeholder: 公式YouTube、X(Twitter)、WikidataなどのURL
    validations:
      required: true
