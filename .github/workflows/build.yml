name: Build & Release Dictionaries

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate dataset
        run: |
          python3 src/validator.py

      - name: Build IME dictionaries
        run: |
          python3 src/builder.py

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vtuber-dict-artifacts
          path: dist/*

      - name: Update latest tag pointer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Create or Update GitHub Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Automated Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            dist/vtuber-dict-all.zip
            dist/google_ime.txt
            dist/ms_ime.txt
            dist/atok.txt
            dist/macos_user_dict.plist
          generate_release_notes: true


