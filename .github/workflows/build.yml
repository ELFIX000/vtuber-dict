name: Build & Release Dictionaries

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate dataset
        run: |
          python3 src/validator.py

      - name: Build IME dictionaries
        run: |
          python3 src/builder.py

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vtuber-dict-artifacts
          path: dist/*

      - name: Determine release version (CalVer)
        id: calver
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            DATE=$(date -u +'%Y.%m.%d')
            TAG="v${DATE}"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              COUNT=1
              while git rev-parse "${TAG}.${COUNT}" >/dev/null 2>&1; do
                COUNT=$((COUNT + 1))
              done
              TAG="${TAG}.${COUNT}"
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "Determined release tag: $TAG"

      - name: Create GitHub Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.calver.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          name: "Release ${{ steps.calver.outputs.TAG }}"
          make_latest: true
          files: |
            dist/vtuber-dict-all.zip
            dist/google_ime.txt
            dist/ms_ime.txt
            dist/atok.txt
            dist/macos_user_dict.plist
          generate_release_notes: true



