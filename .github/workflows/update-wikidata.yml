name: Update from Wikidata

on:
  schedule:
    # 毎月1日の午前3時(UTC)に自動実行
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and merge from Wikidata
        run: |
          python3 src/fetch_wikidata.py --limit 3000

      - name: Validate merged dataset
        run: |
          python3 src/validator.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update VTuber data from Wikidata"
          title: "🤖 [Automated] Update VTuber dictionary data from Wikidata"
          body: |
            Wikidataの最新SPARQLクエリ結果をもとにマスターデータ（`data/vtubers.json`）を更新しました。
            差分内容をご確認の上、マージしてください。
          branch: auto-update-wikidata
          delete-branch: true
